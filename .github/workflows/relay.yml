name: Relay

# 9r-relay (Go): test on every change; on a relay-vX.Y.Z tag build the client
# binaries (GitHub Release + SHA256SUMS) and the server image
# ghcr.io/<owner>/9r-relay-server:{X.Y.Z,latest} (amd64 + arm64).
on:
  push:
    branches: [master]
    paths: ["relay/**", ".github/workflows/relay.yml"]
    tags: ["relay-v*"]
  pull_request:
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: relay

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: relay/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet (linux + windows client)
        run: go vet ./... && GOOS=windows go vet ./cmd/9r-relay
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    if: startsWith(github.ref, 'refs/tags/relay-v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: relay/go.sum

      - name: Build client binaries
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#relay-v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad tag $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir -p dist
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""; [[ $os == windows ]] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" \
              -o "dist/9r-relay-$os-$arch$ext" ./cmd/9r-relay
          done
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(printf 'Client: download `9r-relay-windows-amd64.exe`, then in an elevated PowerShell:\n\n```powershell\n.\\9r-relay-windows-amd64.exe install <pairing-code>\n```\n\nPairing codes are created in Cockpit (manage.lampt.works → 9router & Relay). Verify downloads with `SHA256SUMS.txt`.\n\nServer image: `ghcr.io/%s/9r-relay-server:%s`\n' "${GITHUB_REPOSITORY_OWNER,,}" "$VERSION")
          gh release create "$GITHUB_REF_NAME" dist/* --title "9r-relay $VERSION" --notes "$notes" --verify-tag

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/9r-relay-server:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/9r-relay-server:latest
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
          provenance: false
