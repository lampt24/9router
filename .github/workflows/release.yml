name: GitHub Release

# Runs alongside docker-publish.yml on every vX.Y.Z tag: builds the installable
# CLI package (npm tarball) and publishes a GitHub Release with it attached.
#   Install:  npm i -g https://github.com/<owner>/9router/releases/download/vX.Y.Z/9router-X.Y.Z.tgz
#   Docker:   ghcr.io/<owner>/9router:X.Y.Z
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check versions match tag
        run: |
          v="${TAG#v}"
          test "$(node -p 'require("./package.json").version')" = "$v"
          test "$(node -p 'require("./cli/package.json").version')" = "$v"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix cli install --no-audit --no-fund --ignore-scripts

      - name: Build CLI package
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run cli:pack
          ls -lh *.tgz
          sha256sum *.tgz > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${v}"
          pre=""; [[ "$v" == *-* ]] && pre="--prerelease"
          notes=$(printf '## Install\n\n```bash\nnpm i -g https://github.com/%s/releases/download/%s/9router-%s.tgz\n```\n\n## Docker\n\n```bash\ndocker pull %s\n```\n' "$GITHUB_REPOSITORY" "$TAG" "$v" "$image")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.tgz SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" *.tgz SHA256SUMS.txt --title "$TAG" --notes "$notes" --verify-tag $pre
          fi
