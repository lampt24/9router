<svg width="280" height="64" viewBox="0 0 280 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Brand Gradient -->
    <linearGradient id="lw-brand" x1="4" y1="4" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A59"/>
      <stop offset="55%" stop-color="#E56A4A"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="lw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subdued Grid/Circuit Gradient -->
    <linearGradient id="lw-circuit" x1="16" y1="16" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Container (Squircle) -->
  <g transform="translate(4, 8)">
    <!-- Squircle base with ambient drop shadow -->
    <rect width="48" height="48" rx="14" fill="url(#lw-brand)"/>
    <!-- Glass edge highlight -->
    <rect x="0.5" y="0.5" width="47" height="47" rx="13.5" stroke="white" stroke-opacity="0.25" fill="none"/>

    <!-- Central Routing Nexus Icon Geometry -->
    <!-- Center Core Node -->
    <circle cx="24" cy="24" r="4.5" fill="#FFFFFF" filter="url(#lw-glow)"/>
    <circle cx="24" cy="24" r="2" fill="#C2410C"/>

    <!-- Converging Routing Paths -->
    <!-- Top-Left Input Stream -->
    <path d="M 13 14 L 18 19 L 21 21" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <circle cx="13" cy="14" r="2.2" fill="white"/>

    <!-- Top-Right Input Stream -->
    <path d="M 35 14 L 30 19 L 27 21" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <circle cx="35" cy="14" r="2.2" fill="white"/>

    <!-- Bottom Outflow Stream (Auto-fallback to multiple providers) -->
    <path d="M 24 28.5 L 24 35" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 24 35 L 17 38" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M 24 35 L 31 38" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <circle cx="17" cy="38" r="1.8" fill="white"/>
    <circle cx="31" cy="38" r="1.8" fill="white"/>

    <!-- Orbital dynamic packet indicator -->
    <circle cx="28.5" cy="17.5" r="1.2" fill="#FEF08A"/>
    <circle cx="19.5" cy="17.5" r="1.2" fill="#FEF08A"/>
  </g>

  <!-- Typography: lampt.works -->
  <text x="66" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.03em" fill="currentColor">
    lampt<tspan fill="#E56A4A">.works</tspan>
  </text>

  <!-- Subtitle: ROUTER -->
  <g transform="translate(67, 50)">
    <rect x="-1" y="-10" width="76" height="15" rx="4" fill="#E56A4A" fill-opacity="0.12"/>
    <text x="5" y="1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="0.22em" fill="#E56A4A">
      ROUTER
    </text>
  </g>
</svg>
